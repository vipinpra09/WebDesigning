<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page</title>
</head>
<body>

            <th>AUTHOR</th>

        <tr>
            <td>XML Bible</td>
            <td>Winston</td>
            <td>$40.5</td>
            <td>1</td>
            <td>$40.5</td>
        </tr>

        <tr>
            <td>AI</td>
            <td>S. Russel</td>
            <td>$63</td>
            <td>1</td>
            <td>$63</td>
        </tr>

        <tr>
            <td>Java 2</td>
            <td>Watson</td>
            <td>$35.5</td>
            <td>1</td>
            <td>$35.5</td>
        </tr>

        <tr>
            <th colspan="4">TOTAL AMOUNT</th>
            <th>$139</th>
        </tr>

        <tr>
            <td colspan="5" align="center">
                <button>PLACE ORDER</button>
                <button>RESET</button>
            </td>
        </tr>

    </table>

</center>

</body>
</html>
